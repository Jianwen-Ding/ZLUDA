[package]
name = "zluda_metal"
version = "0.0.0"
edition = "2021"

[lib]
name = "zluda_metal"
crate-type = ["cdylib", "rlib"]

[dependencies]
ptx = { path = "../ptx" }
ptx_parser = { path = "../ptx_parser" }
llvm_zluda = { path = "../llvm_zluda" }
agx-sim = { path = "../../AGX-Performance-Simulator/rust" }
serde_json = "1"

[build-dependencies]
cc = "1.0.69"

# Separate workspace: built against a system LLVM (ZLUDA_SYSTEM_LLVM_CONFIG)
# rather than the ROCm LLVM submodule used by the main ZLUDA workspace.
[workspace]

[patch.crates-io]
highs-sys = { path = "../ext/highs-sys" }
